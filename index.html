<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign - Offline</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #333; /* Cor de "lixo", quase invisível */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            border: 1px solid #1a1a1a;
            padding: 20px;
            border-radius: 5px;
        }
        h1 { font-size: 1.2rem; letter-spacing: 2px; }
        p { font-size: 0.8rem; }
        .status { color: #550000; font-weight: bold; } /* Vermelho sangue seco */
    </style>
</head>
<body>
    <div class="container">
        <h1>403 - ACESSO RESTRITO</h1>
        <p>Aguardando resposta do servidor...</p>
        <p class="status">[ SESSÃO EXPIRADA PELA INÉRCIA ]</p>
        </div>
</body>
<script>
    // Protocolo Vácuo: Desabilita qualquer tentativa de interação
    console.log("Status: 100% PAÍZI. Procurando suprimentos? Aqui só tem vácuo.");
    window.onload = function() {
        // Se o carniça tentar clicar, não acontece nada.
        document.addEventListener('contextmenu', event => event.preventDefault());
    }
</script>
</html>
